version: "2.4"
experiment:
  name: "Dual-Target Drug Discovery"
  date: "2026-02-03"
  modes: [single_a, single_b, double]
  seeds: [42, 137, 256, 512, 1024]

data_sources:
  calibration_set:
    path: "data/calibration/zinc_druglike_calibration_1000_v2024.smi"
    sha256: "UNKNOWN"
  baseline_set:
    path: "data/baseline/zinc_druglike_baseline_1000_seed42.smi"
    sha256: "UNKNOWN"

configs:
  experiment_yaml:
    path: "configs/experiment.yaml"
    sha256: "UNKNOWN"
  pairs_yaml:
    path: "configs/pairs.yaml"
    sha256: "UNKNOWN"
  metrics_yaml:
    path: "configs/metrics.yaml"
    sha256: "UNKNOWN"
  normalization_yaml:
    path: "configs/normalization.yaml"
    sha256: "UNKNOWN"

primary_metric:
  source: "Boltz-2 affinity_pred_value"
  unit: "log10(IC50 microM)"
  direction: "lower_is_better"
  hit_threshold: 0.0

software:
  docker_image_digest: "UNKNOWN"
  boltz_version: "UNKNOWN"
  docking_program: "unidock_gpu"
  docking_version: "UNKNOWN"
