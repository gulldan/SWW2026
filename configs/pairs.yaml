# Protein target pairs for the dual-target selectivity experiment.
# Each pair defines two targets (A and B) with their PDB structures and metadata.
#
# Selection: 10 pairs from 5 therapeutic categories (see target_pairs_catalog.html)
# Criteria: high binding-site similarity (>=53%), approved selective drug, quality PDB structures
# Similarity range: 53% (ERa/ERb) to 90% (FGFR1/FGFR2)
# Selectivity range: 1.2x (lapatinib) to ~4600x (saroglitazar)

pairs:
  # --- I. Oncology Kinase (4 pairs) ---

  EGFR_HER2:
    description: "Dual EGFR/HER2 inhibition - ~80% kinase domain ID, RMSD 1.1 A. Lapatinib FDA 2007."
    boltz2_status: "ok"
    set: "core"
    similarity: "Very High (~80% kinase domain)"
    selectivity_ratio: "Lapatinib: 10.8/9.3 nM (1.2x, near-equipotent)"
    ground_truth_drug: "Lapatinib"
    nw_domain: "81.3% Protein kinase (268 aa)"
    target_a:
      id: EGFR
      name: "Epidermal growth factor receptor"
      uniprot: P00533
      pdb_id: 1XKK
      organism: "Homo sapiens"
      binding_site: "ATP-binding site, kinase domain"
      chembl_id: CHEMBL203
